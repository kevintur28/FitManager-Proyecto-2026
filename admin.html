<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Admin - FitManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">

    <script src="JS/script.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">

        <!-- ===== SIDEBAR ===== -->
        <div class="sidebar">

            <div class="sidebar-logo">
                <img src="img/Fitmanagerpro.png" class="logo">
                <h2>FITMANAGER</h2>
            </div>

            <ul>
                <li onclick="mostrarSeccion('usuarios', this)" class="activo">
                    Usuarios
                </li>

                <li onclick="mostrarSeccion('clases', this)">
                    Clases
                </li>

                <li onclick="mostrarSeccion('vencimientos', this)">
                    Vencimientos
                </li>

                <li onclick="mostrarSeccion('metasAdmin', this)">
                    Metas
                </li>

                <li onclick="logout()">
                    Salir
                </li>
            </ul>

        </div>

        <!-- ===== CONTENIDO ===== -->
        <div class="contenido">

            <!-- ===== USUARIOS ===== -->
            <div id="usuarios" class="seccion activa">

                <h1>Usuarios registrados</h1>

                <div class="tabla-container">

                    <table class="table">

                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo Doc</th>
                                <th>Documento</th>
                                <th>Correo</th>
                                <th>Membresía</th>
                                <th>Vencimiento</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <!-- SOLO UNO -->
                        <tbody id="tabla-usuarios">
                        </tbody>

                    </table>

                </div>

            </div>

            <!-- ===== CLASES ===== -->
            <div id="clases" class="seccion">

                <h1>Clases</h1>

                <form onsubmit="crearClase(event)">

                    <input
                        type="text"
                        id="nombreClase"
                        placeholder="Nombre de la clase"
                        required
                    >

                    <button type="submit">
                        Crear Clase
                    </button>

                </form>

                <div id="clases-admin" class="cards"></div>

            </div>

            <!-- ===== VENCIMIENTOS ===== -->
            <div id="vencimientos" class="seccion">

                <h1>Asignar vencimiento</h1>

                <form onsubmit="asignarVencimiento(event)">

                    <input
                        type="email"
                        id="correoVencimiento"
                        placeholder="Correo del usuario"
                        required
                    >

                    <input
                        type="date"
                        id="fechaVencimiento"
                        required
                    >

                    <button type="submit">
                        Asignar
                    </button>

                </form>

            </div>

            <!-- ===== METAS ADMIN ===== -->
            <div id="metasAdmin" class="seccion">

                <h1>Asignar metas a usuarios</h1>

                <form onsubmit="asignarMeta(event)">

                    <input
                        type="email"
                        id="correoMeta"
                        placeholder="Correo del usuario"
                        required
                    >

                    <input
                        type="text"
                        id="ejercicioMeta"
                        placeholder="Ejercicio"
                        required
                    >

                    <input
                        type="number"
                        id="valorMeta"
                        placeholder="Meta (reps)"
                        required
                    >

                    <button type="submit">
                        Asignar Meta
                    </button>

                </form>

                <div id="lista-metas-admin" class="cards"></div>

            </div>

        </div>

    </div>

    <footer class="footer">
        <p>© 2026 FitManager - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
