<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="admin-container">

<aside class="admin-sidebar">

<h3>Administrador</h3>

<button onclick="mostrarAdmin('inicio')" class="nav-btn">Inicio</button>
<button onclick="mostrarAdmin('clientes')" class="nav-btn">Clientes</button>
<button onclick="mostrarAdmin('clases')" class="nav-btn">Clases</button>

<button onclick="logout()" class="btn danger">Cerrar sesión</button>

</aside>

<main class="admin-content">

<section id="inicio" class="admin-sec">

<h2>Panel Administrador</h2>
<p>Gestión de clientes y clases</p>

</section>

<section id="clientes" class="admin-sec hidden">

<h2>Clientes</h2>

<table>

<thead>
<tr>
<th>Email</th>
<th>Membresía</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tablaClientes"></tbody>

</table>

</section>

<section id="clases" class="admin-sec hidden">

<h2>Clases</h2>

<input id="nombreClase" placeholder="Nombre clase">
<input id="horarioClase" placeholder="Horario">

<button onclick="agregarClase()" class="btn">Agregar clase</button>

<table>

<thead>
<tr>
<th>Clase</th>
<th>Horario</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tablaClasesAdmin"></tbody>

</table>

</section>

</main>

</div>

<script src="script.js"></script>

</body>
</html>
