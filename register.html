<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- JS -->
    <script src="JS/script.js" defer></script>

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>

<body class="register-body">

    <!-- BOTON VOLVER -->
    <button id="btnVolver" class="btn-volver-icon">
        ←
    </button>

    <!-- CONTENEDOR -->
    <div class="container h-100">

        <!-- ROW CENTRADO -->
        <div class="row h-100 justify-content-center align-items-center">

            <!-- COLUMNA -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 d-flex justify-content-center">

                <!-- CARD LOGIN -->
                <div class="container-login">

                    <h1 class="text-center mb-4">Registro</h1>

                    <form onsubmit="registrar(event)">

                        <div class="row g-3">

                            <!-- NOMBRE -->
                            <div class="col-12">
                                <input type="text" id="nombres" placeholder="Nombre completo" required>
                            </div>

                            <!-- TIPO DOC -->
                            <div class="col-12">
                                <select id="tipoDoc" class="select-pro" required>
                                    <option value="">Tipo de documento</option>
                                    <option value="TI">Tarjeta de Identidad (T.I)</option>
                                    <option value="CC">Cédula de Ciudadanía (C.C)</option>
                                    <option value="CE">Cédula de Extranjería (C.E)</option>
                                    <option value="PEP">Permiso Especial de Permanencia (P.E.P)</option>
                                    <option value="PA">Pasaporte (P.A)</option>
                                </select>
                            </div>

                            <!-- DOCUMENTO -->
                            <div class="col-12">
                                <input type="text" id="documento" placeholder="Documento" required>
                            </div>

                            <!-- CORREO -->
                            <div class="col-12">
                                <input type="email" id="correo" placeholder="Correo" required>
                            </div>

                            <!-- MEMBRESIA -->
                            <div class="col-12">
                                <select id="membresia" class="select-pro" required>
                                    <option value="">Membresía</option>
                                    <option value="1">1 mes</option>
                                    <option value="3">3 meses</option>
                                    <option value="6">6 meses</option>
                                    <option value="12">1 año</option>
                                </select>
                            </div>

                            <!-- PASSWORD -->
                            <div class="col-12">

                                <div class="password-box">

                                    <input type="password" id="password" placeholder="Contraseña" required>

                                    <span onclick="togglePassword('password', this)">
                                        👁
                                    </span>

                                </div>

                            </div>

                            <!-- CONFIRM PASSWORD -->
                            <div class="col-12">

                                <div class="password-box">

                                    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña"
                                        required>

                                    <span onclick="togglePassword('confirmPassword', this)">
                                        👁
                                    </span>

                                </div>

                            </div>

                            <!-- CHECKBOX -->
                            <div class="col-12">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="aceptaPolitica" required>

                                    <label class="form-check-label" for="aceptaPolitica">

                                        Acepto la política de tratamiento de datos

                                    </label>

                                </div>

                            </div>

                            <!-- BOTON -->
                            <div class="col-12">
                                <button type="submit" class="w-100">
                                    Registrarse
                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 FitManager - Todos los derechos reservados
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
