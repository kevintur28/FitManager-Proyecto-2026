<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registro - FitManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="CSS/styles.css"><link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet"><script src="JS/app.js" defer></script>
</head>
<body class="register-body">
  <button id="btnVolver" class="btn-volver-icon">←</button>
  <div class="container h-100"><div class="row h-100 justify-content-center align-items-center"><div class="col-12 col-sm-10 col-md-8 col-lg-5 d-flex justify-content-center"><div class="container-login"><h1 class="text-center mb-4">Registro</h1><form onsubmit="registerUser(event)"><input type="hidden" id="tipoCompra"><input type="hidden" id="idCompra"><div class="row g-3"><div class="col-12"><input type="text" id="nombres" placeholder="Nombre completo" required></div><div class="col-12"><select id="tipoDoc" class="select-pro" required></select></div><div class="col-12"><input type="text" id="documento" placeholder="Documento" required></div><div class="col-12"><label for="fechaNacimiento" class="fecha-label">Fecha de nacimiento</label><input type="date" id="fechaNacimiento" class="fecha-input" required></div><div class="col-12"><input type="email" id="correo" placeholder="Correo" required></div><div class="col-12"><select id="membresia" class="select-pro" required></select></div><div class="col-12"><div class="password-box"><input type="password" id="password" placeholder="Contraseña" required><span onclick="togglePassword('password', this)">Ver</span></div></div><div class="col-12"><div class="password-box"><input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required><span onclick="togglePassword('confirmPassword', this)">Ver</span></div></div><div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="aceptaPolitica" required><label class="form-check-label" for="aceptaPolitica">Acepto la politica de tratamiento de datos</label></div></div><div class="col-12"><button type="submit" class="w-100">Registrarse</button></div></div></form><p>¿Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p></div></div></div></div>
  <footer class="footer">© 2026 FitManager - Todos los derechos reservados</footer>
</body>
</html>
